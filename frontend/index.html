<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boardly</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Boardly</h1>
    <span class="topbar__hint">Мини-канбан-доска</span>
  </header>

  <main id="board" class="board" aria-live="polite"></main>

  <template id="column-template">
    <section class="column" data-column-id="">
      <div class="column__header">
        <h2 class="column__title"></h2>
        <span class="column__count">0</span>
      </div>
      <div class="task-list" data-column-id=""></div>
      <button class="btn btn--add" type="button" data-action="add-task">+ Добавить задачу</button>
    </section>
  </template>

  <template id="task-card-template">
    <article class="task-card" draggable="true" tabindex="0" data-task-id="">
      <h3 class="task-card__title"></h3>
      <p class="task-card__description"></p>
    </article>
  </template>

  <div id="task-modal" class="modal" hidden>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Новая задача</h2>
      <form id="task-form">
        <label for="task-title">Заголовок</label>
        <input id="task-title" name="title" type="text" maxlength="200" required>

        <label for="task-description">Описание</label>
        <textarea id="task-description" name="description" rows="4"></textarea>

        <div class="modal__actions">
          <button type="button" id="task-delete" class="btn btn--danger" hidden>Удалить</button>
          <div class="modal__actions-right">
            <button type="button" id="task-cancel" class="btn btn--ghost">Отмена</button>
            <button type="submit" class="btn btn--primary">Сохранить</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Поменяйте, если backend поднят не на localhost:8000
    window.KANBAN_API_BASE = 'http://localhost:8000/api';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
